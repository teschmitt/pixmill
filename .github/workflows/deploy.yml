name: Deploy to GitHub Pages

# Build runs on every push to main and every PR (so PRs catch broken
# builds), but only main pushes deploy — GH Pages only hosts one site
# per repo.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default-deny + targeted grants. Pages deploy needs `pages: write`
# and the OIDC id-token for `actions/deploy-pages`.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't queue main deploys behind each other; for PR builds it's safe
# to cancel an older run when a newer push arrives on the same branch.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    # SvelteKit prefixes every absolute URL it emits with `kit.paths.base`.
    # GH Pages serves the site at `<user>.github.io/<repo>/`, so we set
    # BASE_PATH to `/<repo>` at build time. If you bind a custom domain
    # (which serves at the root), set this to an empty string.
    env:
      BASE_PATH: /${{ github.event.repository.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # ubuntu-latest ships with rustup pre-installed. `rustup show`
      # honors rust-toolchain.toml, which pins the channel + wasm32 target.
      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown

      # Cache the cargo registry, build output, and wasm-pack's
      # downloaded wasm-opt binary. The cache key is invalidated only
      # when Cargo.lock or the pinned toolchain change.
      - name: Cache Cargo + wasm-pack
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-pack
            ~/.cache/.wasm-pack
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install wasm-pack
        run: command -v wasm-pack || cargo install wasm-pack --locked

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
