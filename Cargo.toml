[workspace]
resolver = "2"
members = ["src-tauri", "crates/pixmill-core", "crates/pixmill-wasm"]
# pixmill-wasm only builds for wasm32-unknown-unknown. Excluding it from the
# default set keeps `cargo check` / `cargo build` from trying to compile it
# for the host target, where js-sys / wasm-bindgen glue would fail to link.
default-members = ["src-tauri", "crates/pixmill-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
fast_image_resize = { version = "5", features = ["image"] }
kamadak-exif = "0.6"
rayon = "1"
walkdir = "2"
base64 = "0.22"
webp = "0.3.1"

# Release profile tuned for small bundle size.
# `opt-level = "s"` favors size over raw speed; switch to 3 if image
# processing throughput becomes a bottleneck.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false

# Faster local builds when you want to iterate near-release behavior
# (e.g. profile a hot path) without paying the full LTO cost.
[profile.release-fast]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16
strip = "none"
