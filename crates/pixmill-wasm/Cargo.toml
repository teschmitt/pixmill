[package]
name = "pixmill-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "pixmill_wasm"
path = "src/lib.rs"
crate-type = ["cdylib"]

# Rust 1.82+ emits WebAssembly SIMD (v128.*) and bulk-memory ops by default for
# wasm32-unknown-unknown. wasm-pack's bundled wasm-opt validates without those
# features enabled and aborts with "SIMD operations require SIMD [--enable-simd]".
# Pass the flags through so the optimizer accepts our binary.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O', '--enable-simd', '--enable-bulk-memory', '--enable-nontrapping-float-to-int']

[features]
default = []
# Install console_error_panic_hook on startup so wasm panics surface in the
# browser console with a real stack trace instead of "unreachable executed".
# Add ~1KB to the bundle; useful in dev, not strictly needed in prod.
console_panic = ["dep:console_error_panic_hook"]

[dependencies]
# default-features = false drops `fs` (no walkdir/rayon, no path-taking
# APIs) and `lossy-webp` (no libwebp-sys C compile) — the two pieces of
# pixmill-core that don't compile to wasm32-unknown-unknown.
pixmill-core = { path = "../pixmill-core", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
base64 = { workspace = true }
console_error_panic_hook = { version = "0.1", optional = true }
